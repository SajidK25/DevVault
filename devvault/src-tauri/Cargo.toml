[package]
name = "devvault"
version = "0.1.0"
description = "Local encrypted credential & notes manager"
authors = ["DevVault"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "devvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# Errors / paths / ids
thiserror = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

# System URL opener
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
